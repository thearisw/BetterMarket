<title>Marketwide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky search rail on top, filter column left, listing grid right; search area set in a map dialog; collections swap the main view. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b2430; --muted:#5d6672; --line:#dcdfd8;
  --tag:#f2b84b; --tag-ink:#3a2a05; --accent:#1f5f8b; --accent-soft:#e3edf4;
  --fb:#3b6fd8; --kj:#2f8f4e; --kr:#e3742b; --cl:#7b4fb8; --danger:#b4372f;
  --land:#eceee6; --water:#c6d9e5; --map-label:#6b7480; --map-edge:#b5c9d6;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 6px 18px rgba(27,36,48,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181e; --surface:#1b222a; --ink:#e8ecef; --muted:#9aa4ae; --line:#2c353f;
  --tag:#e9ad3d; --tag-ink:#2a1e03; --accent:#6fb0dc; --accent-soft:#1c3346;
  --fb:#7aa0f0; --kj:#5cc07c; --kr:#f39a5c; --cl:#b08ee6; --danger:#f07a70;
  --land:#232b33; --water:#14273a; --map-label:#8d98a3; --map-edge:#1f3a52;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181e; --surface:#1b222a; --ink:#e8ecef; --muted:#9aa4ae; --line:#2c353f;
  --tag:#e9ad3d; --tag-ink:#2a1e03; --accent:#6fb0dc; --accent-soft:#1c3346;
  --fb:#7aa0f0; --kj:#5cc07c; --kr:#f39a5c; --cl:#b08ee6; --danger:#f07a70;
  --land:#232b33; --water:#14273a; --map-label:#8d98a3; --map-edge:#1f3a52;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;white-space:nowrap}
.brand-tag{width:30px;height:22px;background:var(--tag);border-radius:3px 10px 10px 3px;position:relative}
.brand-tag::after{content:"";position:absolute;left:6px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--bg)}
.search{flex:1 1 360px;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 14px;outline:none}
.scope{display:flex;border-left:1px solid var(--line)}
.scope button{border:0;background:transparent;padding:0 12px;font-size:13px;color:var(--muted);font-weight:700}
.scope button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.locchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:700;max-width:100%;min-width:0}
.locchip svg{width:16px;height:16px;color:var(--accent);flex:none}
.locchip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locchip .km{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.navbtns{display:flex;gap:8px}
.nav{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count-pill{font-family:var(--font-mono);font-size:12px;background:var(--tag);color:var(--tag-ink);padding:1px 7px;border-radius:999px}

.notice{font-size:13px;color:var(--muted);padding-block:10px 0;margin:0}
.notice b{color:var(--ink)}

main{padding-block:12px 60px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}

aside.filters{display:flex;flex-direction:column;gap:22px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
@media (max-width:820px){aside.filters{position:static;flex-direction:row;flex-wrap:wrap;gap:16px}}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.areabox{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.areabox b{font-size:14px}
.areabox span{font-size:13px;color:var(--muted)}
.areabox em{font-style:normal;color:var(--accent);font-weight:700;font-size:13px}
.price-row{display:flex;align-items:center;gap:8px}
.price-row label{position:relative;flex:1}
.price-row span.cur{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--font-mono);font-size:13px}
.price-row input{width:100%;padding:8px 8px 8px 22px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--font-mono);font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.src-list{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.src-list{flex-direction:row;flex-wrap:wrap}}
.src{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.src input{accent-color:var(--accent);width:16px;height:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.src .n{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.reset{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-align:left;font-size:14px}

.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
.results-head h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.results-head .meta{color:var(--muted);font-size:14px}
.rh-left{display:flex;flex-direction:column;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover{box-shadow:var(--shadow)}
.thumb{aspect-ratio:4/3;max-width:100%;position:relative;display:flex;align-items:flex-end;padding:10px;border:0;width:100%;text-align:left}
.thumb .cat{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.03em;color:rgba(255,255,255,.92);line-height:1;text-shadow:0 1px 8px rgba(0,0,0,.15)}
.pricetag{position:absolute;top:10px;left:0;background:var(--tag);color:var(--tag-ink);font-family:var(--font-mono);font-weight:700;font-size:15px;padding:4px 12px 4px 10px;border-radius:0 8px 8px 0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.save{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#1b2430}
.save svg{width:18px;height:18px}
.save.on{background:#1b2430;color:#f2b84b}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctitle{font-weight:700;font-size:15px;line-height:1.3;border:0;background:none;padding:0;text-align:left}
.cdesc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px;flex-wrap:wrap}
.srcbadge{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.kmtag{font-family:var(--font-mono);font-weight:700;color:var(--accent)}
mark{background:var(--tag);color:var(--tag-ink);border-radius:2px;padding:0 1px}

/* compact density */
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid.compact .card{border-radius:10px}
.grid.compact .thumb{aspect-ratio:3/2;padding:7px}
.grid.compact .thumb .cat{font-size:17px}
.grid.compact .pricetag{font-size:12px;top:7px;padding:2px 8px 2px 7px}
.grid.compact .save{width:28px;height:28px;top:5px;right:5px}
.grid.compact .save svg{width:14px;height:14px}
.grid.compact .cbody{padding:8px 10px 10px;gap:3px}
.grid.compact .ctitle{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.compact .cdesc{display:none}
.grid.compact .cfoot{font-size:11px;padding-top:2px}
.grid.compact .cfoot .area,.grid.compact .cfoot .age{display:none}

.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--font-display);margin:0 0 6px}

/* popover */
.pop{position:fixed;z-index:70;width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px}
.pop h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pop-list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.pop-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.pop-item:hover{background:var(--accent-soft)}
.pop-item input{accent-color:var(--accent);width:16px;height:16px}
.pop-item .cap{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.pop-item.full{opacity:.55;cursor:not-allowed}
.newcol{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.newcol input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:700;border-radius:8px;padding:7px 12px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.pop-msg{font-size:12px;color:var(--danger);margin-top:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:45;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.drawer .thumb{border-radius:10px}
.drawer h2{font-family:var(--font-display);font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.close{align-self:flex-end;border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px}
.drawer p{margin:0;white-space:pre-line}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a{text-decoration:none}

/* location dialog */
.locwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(10,14,20,.45)}
.locpanel{width:min(1040px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.lochead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.lochead h2{font-family:var(--font-display);font-size:22px;margin:0}
.locbody{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:20px;padding:20px}
@media (max-width:760px){.locbody{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--water)}
.mapbox canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.maphint{font-size:12px;color:var(--muted);margin-top:8px}
.mapbadge{position:absolute;left:8px;bottom:8px;font-size:11px;background:var(--surface);color:var(--muted);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoom button{border:0;background:none;width:32px;height:32px;font-weight:700;font-size:18px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.loccontrols{display:flex;flex-direction:column;gap:18px;min-width:0}
.addr{position:relative}
.addr input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:8px 12px;text-align:left;font-size:14px}
.sugg button:hover,.sugg button.hi{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
.addr-msg{font-size:12px;color:var(--muted);margin-top:6px}
.addr-msg.err{color:var(--danger)}
.rad{display:flex;align-items:center;gap:10px}
.rad input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.rad .num{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-right:8px}
.rad .num input{width:64px;border:0;background:none;padding:7px 4px 7px 10px;font-family:var(--font-mono);font-weight:700;outline:none}
.rad .num span{font-size:13px;color:var(--muted)}
.inarea{font-size:14px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.inarea b{font-family:var(--font-mono)}
.applied{display:flex;flex-direction:column;gap:8px;font-size:13px}
.applied li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 10px;align-items:start}
.applied li .dot{margin-top:5px}
.applied li span{color:var(--muted)}
.applied ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.locfoot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}

/* collections view */
.col-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
@media (max-width:820px){.col-layout{grid-template-columns:minmax(0,1fr)}}
.col-list{display:flex;flex-direction:column;gap:6px}
.col-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.col-item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.col-item .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-item .cap{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.col-head{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.col-head-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col-head h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-.01em}
.col-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.col-tools input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.col-tools input[type=number]{width:80px;font-family:var(--font-mono)}
.confirm{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--danger);border-radius:10px;padding:8px 12px;font-size:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:80;font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}.drawer{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span class="brand-tag" aria-hidden="true"></span>Marketwide</div>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Search listings, e.g. bike, standing desk" aria-label="Search listings" autocomplete="off">
        <div class="scope" role="group" aria-label="Search in">
          <button type="button" data-scope="both" aria-pressed="true">All</button>
          <button type="button" data-scope="title" aria-pressed="false">Title</button>
          <button type="button" data-scope="desc" aria-pressed="false">Description</button>
        </div>
      </form>
      <button class="locchip" id="locChip" aria-label="Change search area"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span class="lbl" id="locChipLbl">Downtown</span><span class="km" id="locChipKm">15 km</span></button>
      <div class="navbtns">
        <button class="nav" id="navBrowse" aria-current="true">Browse</button>
        <button class="nav" id="navCols" aria-current="false">Collections <span class="count-pill" id="savedCount">0</span></button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="notice"><b>Prototype.</b> Listings are sample data around Metro Vancouver, labelled with the marketplace they'd come from. Collections and your search area are saved in this browser.</p>

  <section id="browseView" class="layout" style="margin-top:14px">
    <aside class="filters" aria-label="Filters">
      <div class="fgroup">
        <span class="flabel">Search area</span>
        <button class="areabox" id="areaBox"><b id="areaName">Downtown</b><span id="areaKm">Within 15 km</span><em>Change on map</em></button>
      </div>
      <div class="fgroup">
        <span class="flabel">Price (CAD)</span>
        <div class="price-row">
          <label><span class="cur">$</span><input id="pmin" type="number" min="0" inputmode="numeric" placeholder="Min" aria-label="Minimum price"></label>
          <span style="color:var(--muted)">–</span>
          <label><span class="cur">$</span><input id="pmax" type="number" min="0" inputmode="numeric" placeholder="Max" aria-label="Maximum price"></label>
        </div>
        <div class="presets">
          <button class="chip" data-p="0,0">Free</button>
          <button class="chip" data-p="0,50">Under $50</button>
          <button class="chip" data-p="50,200">$50–200</button>
          <button class="chip" data-p="200,">$200+</button>
        </div>
      </div>
      <div class="fgroup">
        <span class="flabel">Marketplaces</span>
        <div class="src-list" id="srcList"></div>
      </div>
      <div class="fgroup">
        <label class="flabel" for="sort">Sort by</label>
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="near">Distance: nearest first</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
        </select>
      </div>
      <button class="reset" id="reset">Clear all filters</button>
    </aside>

/* ---- filtering ---- */
function withDist(){LISTINGS.forEach(l=>l.km=km(state.loc,l))}

function filtered(){
  withDist();

  let r=LISTINGS.filter(l=>{
    if(l.km>state.loc.r)return false;
    if(!state.srcs.has(l.src))return false;
    if(min!==null&&l.price<min)return false;
    if(max!==null&&l.price>max)return false;
    if(ts.length){const hay=(state.scope==="title"?l.title:state.scope==="desc"?l.desc:l.title+" "+l.desc).toLowerCase();
      if(!ts.every(t=>hay.includes(t)))return false}
    return true});

  r.sort(sorts[state.sort]||sorts.new);

const RIVERS=[
 {w:1.4,pts:[[-123.152,49.31],[-123.11,49.304],[-123.07,49.298],[-123.03,49.292],[-122.99,49.29],[-122.955,49.295],[-122.92,49.3],[-122.89,49.296],[-122.86,49.29]]},
 {w:1.2,pts:[[-122.935,49.298],[-122.94,49.33],[-122.93,49.37],[-122.915,49.42],[-122.9,49.47]]},
 {w:0.5,pts:[[-123.142,49.274],[-123.12,49.272],[-123.1,49.27]]},
 {w:0.8,pts:[[-123.22,49.21],[-123.17,49.205],[-123.12,49.2],[-123.06,49.199],[-123.0,49.198],[-122.96,49.199]]},
 {w:1.1,pts:[[-123.195,49.12],[-123.13,49.123],[-123.08,49.135],[-123.03,49.15],[-122.98,49.168],[-122.93,49.195],[-122.89,49.21],[-122.84,49.214],[-122.78,49.212],[-122.72,49.205],[-122.66,49.195],[-122.6,49.19],[-122.5,49.175]]},
 {w:0.7,pts:[[-122.74,49.21],[-122.725,49.24],[-122.7,49.28],[-122.69,49.33]]}
];
const map={cv:null,ctx:null,w:0,h:0,zoom:1,cx:0,cy:0,drag:null};
function mScale(){return map.w/MAP_W_KM*map.zoom}  // px per km
function proj(lat,lng){const s=mScale();return [map.w/2+((lng-map.cLng)*KX)*s,map.h/2-((lat-map.cLat)*KY)*s]}
function unproj(x,y){const s=mScale();return [map.cLat-(y-map.h/2)/s/KY,map.cLng+(x-map.w/2)/s/KX]}
function clampCenter(){const halfW=map.w/2/mScale()/KX,halfH=map.h/2/mScale()/KY;
  map.cLng=Math.min(B.E-halfW,Math.max(B.W+halfW,map.cLng));map.cLat=Math.min(B.N-halfH,Math.max(B.S+halfH,map.cLat))}
function handlePos(){const [px,py]=proj(state.loc.lat,state.loc.lng),rp=state.loc.r*mScale();
  for(const a of [0,Math.PI/2,Math.PI,-Math.PI/2,Math.PI/4,-Math.PI/4,3*Math.PI/4,-3*Math.PI/4]){const x=px+Math.cos(a)*rp,y=py+Math.sin(a)*rp;if(x>10&&x<map.w-10&&y>10&&y<map.h-10)return [x,y]}
  return [px+rp,py]}
function drawMap(){
  const {ctx,w,h}=map;if(!ctx)return;
  const dpr=window.devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=tok("--land");ctx.fillRect(0,0,w,h);
  const water=tok("--water");
  [OCEAN,BAY].forEach(poly=>{ctx.beginPath();poly.forEach(([lng,lat],i)=>{const[x,y]=proj(lat,lng);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=water;ctx.fill();ctx.strokeStyle=tok("--map-edge");ctx.lineWidth=1;ctx.stroke()});
  ctx.lineCap="round";ctx.lineJoin="round";
  RIVERS.forEach(rv=>{ctx.beginPath();rv.pts.forEach(([lng,lat],i)=>{const[x,y]=proj(lat,lng);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=water;ctx.lineWidth=Math.max(2.5,rv.w*mScale());ctx.stroke()});
  // border
  ctx.setLineDash([4,4]);ctx.strokeStyle=tok("--map-label");ctx.globalAlpha=.5;ctx.lineWidth=1;const[,by]=proj(49.0,-123);ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(w,by);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  // labels
  ctx.fillStyle=tok("--map-label");ctx.textAlign="center";ctx.textBaseline="middle";
  const lf=getComputedStyle(document.body).fontFamily;
  PLACES.filter(p=>p.major||map.zoom>=2).forEach(p=>{const[x,y]=proj(p.lat,p.lng);if(x<0||x>w||y<0||y>h)return;
    ctx.font=`${p.major?"700 ":""}${p.major?11:10}px ${lf}`;ctx.fillText(p.name.replace("Downtown Vancouver","Vancouver"),x,y-9)});
  // listings
  withDist();
  LISTINGS.forEach(l=>{if(!state.srcs.has(l.src))return;const[x,y]=proj(l.lat,l.lng);const inside=l.km<=state.loc.r;
    ctx.beginPath();ctx.arc(x,y,inside?4.5:3.5,0,Math.PI*2);ctx.fillStyle=tok(SOURCES[l.src].color);ctx.globalAlpha=inside?1:.35;ctx.fill();
    if(inside){ctx.lineWidth=1.5;ctx.strokeStyle=tok("--surface");ctx.stroke()}ctx.globalAlpha=1});
  // radius circle
  const[px,py]=proj(state.loc.lat,state.loc.lng),rp=state.loc.r*mScale(),acc=tok("--accent");
  ctx.beginPath();ctx.arc(px,py,rp,0,Math.PI*2);ctx.fillStyle=acc;ctx.globalAlpha=.12;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=2;ctx.strokeStyle=acc;ctx.stroke();
  // handle
  const[hx,hy]=handlePos();ctx.beginPath();ctx.arc(hx,hy,8,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=acc;ctx.stroke();
  ctx.font=`700 11px ${getComputedStyle(document.body).fontFamily}`;ctx.fillStyle=tok("--ink");ctx.textAlign=hx>w-60?"right":"left";ctx.fillText(state.loc.r+" km",hx+(hx>w-60?-13:13),hy);
  // pin
  ctx.save();ctx.translate(px,py);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-3,-8,-11,-12,-11,-21);ctx.arc(0,-21,11,Math.PI,0);ctx.bezierCurveTo(11,-12,3,-8,0,0);
  ctx.fillStyle=tok("--tag");ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=tok("--ink");ctx.stroke();ctx.beginPath();ctx.arc(0,-21,4,0,Math.PI*2);ctx.fillStyle=tok("--ink");ctx.fill();ctx.restore();
}
function sizeMap(){if(!map.cv)return;const w=map.cv.parentElement.clientWidth,h=Math.round(w*MAP_H_KM/MAP_W_KM),dpr=window.devicePixelRatio||1;
  map.w=w;map.h=h;map.cv.width=w*dpr;map.cv.height=h*dpr;map.cv.style.height=h+"px";clampCenter();drawMap()}
function setupMap(cv){
  map.cv=cv;map.ctx=cv.getContext("2d");map.zoom=1;map.cLat=(B.N+B.S)/2;map.cLng=(B.E+B.W)/2;
  sizeMap();focusOnLoc();
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{const[x,y]=pt(e),[px,py]=proj(state.loc.lat,state.loc.lng),[hx,hy]=handlePos();
    let mode="tap";if(Math.hypot(x-hx,y-hy)<16)mode="radius";else if(Math.hypot(x-px,y-(py-16))<20)mode="pin";
    map.drag={mode,x0:x,y0:y,moved:false,lat0:map.cLat,lng0:map.cLng};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{const[x,y]=pt(e);const d=map.drag;
    if(!d){const[px,py]=proj(state.loc.lat,state.loc.lng),[hx,hy]=handlePos();cv.style.cursor=Math.hypot(x-hx,y-hy)<16?"ew-resize":Math.hypot(x-px,y-(py-16))<20?"grab":"crosshair";return}
    if(Math.hypot(x-d.x0,y-d.y0)>4)d.moved=true;if(!d.moved)return;
    if(d.mode==="radius"){const[px,py]=proj(state.loc.lat,state.loc.lng);setRadius(Math.round(Math.hypot(x-px,y-py)/mScale()),true)}
    else if(d.mode==="pin"){const[lat,lng]=unproj(x,y+0);setPin(lat,lng,null,true)}
    else{const s=mScale();map.cLng=d.lng0-(x-d.x0)/s/KX;map.cLat=d.lat0+(y-d.y0)/s/KY;clampCenter();drawMap()}});
  const end=e=>{const d=map.drag;map.drag=null;if(!d)return;
    if(d.mode==="tap"&&!d.moved){const[lat,lng]=unproj(d.x0,d.y0);setPin(lat,lng,null)}else locChanged()};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",()=>{map.drag=null});
  cv.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY<0?1.25:0.8)},{passive:false});
}
function zoomBy(f){map.zoom=Math.min(6,Math.max(1,map.zoom*f));clampCenter();drawMap()}
function focusOnLoc(){const need=Math.min(MAP_W_KM,MAP_H_KM*MAP_W_KM/MAP_W_KM)/(state.loc.r*2.6);
  map.zoom=Math.min(6,Math.max(1,Math.min(MAP_W_KM/(state.loc.r*2.6),MAP_H_KM/(state.loc.r*2.6))));map.cLat=state.loc.lat;map.cLng=state.loc.lng;clampCenter();drawMap()}

/* ---- location state changes ---- */
function setPin(lat,lng,label,live){
  lat=Math.min(B.N,Math.max(B.S,lat));lng=Math.min(B.E,Math.max(B.W,lng));
  if(!label){const n=nearestPlace(lat,lng);label=n.d<1.2?n.p.name:"Near "+n.p.name}
  state.loc={...state.loc,lat,lng,label:label.replace("Downtown Vancouver","Downtown Vancouver")};
  drawMap();if(!live)locChanged();else locLive()}
function setRadius(r,live){r=Math.min(100,Math.max(1,Math.round(r)||1));state.loc={...state.loc,r};drawMap();if(live)locLive();else locChanged()}
function locLive(){const ri=$("#radNum"),rr=$("#radRange"),ai=$("#addrInput");
  if(ri&&document.activeElement!==ri)ri.value=state.loc.r;if(rr)rr.value=Math.min(60,state.loc.r);
  if(ai&&document.activeElement!==ai)ai.value=state.loc.label;
  document.querySelectorAll("[data-rq]").forEach(c=>c.setAttribute("aria-pressed",+c.dataset.rq===state.loc.r));
  const n=inArea().filter(l=>state.srcs.has(l.src)).length;if($("#inArea"))$("#inArea").innerHTML=`<b>${n}</b> listings in this area right now`;
  document.querySelectorAll("[data-sq]").forEach(s=>s.textContent=srcQuery(s.dataset.sq))}
function locChanged(){locLive();render()}

/* ---- location dialog ---- */
function openLoc(){
  const prev={...state.loc};
  $("#locLayer").innerHTML=`<div class="locwrap" id="locWrap"><div class="locpanel" role="dialog" aria-modal="true" aria-labelledby="locTitle">
    <div class="lochead"><h2 id="locTitle">Search area</h2><button class="close" id="locX" style="align-self:center">Close</button></div>
    <div class="locbody">
      <div style="min-width:0">
        <div class="mapbox"><canvas id="mapCv" aria-label="Map of Metro Vancouver. Click to place the search pin."></canvas>
          <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button></div>
          <span class="mapbadge">Metro Vancouver · schematic</span></div>
        <p class="maphint">Click the map to drop the pin. Drag the pin to move it, or drag the white handle on the circle to change the radius. Drag empty map to pan.</p>
      </div>
      <div class="loccontrols">
        <div class="fgroup"><label class="flabel" for="addrInput">Address or place</label>
          <div class="addr"><input id="addrInput" autocomplete="off" placeholder="e.g. Kitsilano, Metrotown, 49.26, -123.1" value="${esc(state.loc.label)}"><div class="sugg" id="sugg" hidden></div></div>
          <div class="addr-msg" id="addrMsg">Type a neighbourhood or landmark, or paste coordinates.</div></div>
        <div class="fgroup"><label class="flabel" for="radNum">Radius</label>
          <div class="rad"><input type="range" id="radRange" min="1" max="60" value="${Math.min(60,state.loc.r)}" aria-label="Radius slider"><span class="num"><input id="radNum" type="number" min="1" max="100" value="${state.loc.r}"><span>km</span></span></div>
          <div class="presets">${[2,5,10,25,50].map(v=>`<button class="chip" data-rq="${v}" aria-pressed="${state.loc.r===v}">${v} km</button>`).join("")}</div></div>
        <div class="inarea" id="inArea"></div>
        <div class="applied"><span class="flabel">Sent to each marketplace</span><ul>
          ${Object.entries(SOURCES).map(([k,s])=>`<li><span class="dot" style="background:var(${s.color})"></span><div><b>${s.short}</b><br><span data-sq="${k}">${esc(srcQuery(k))}</span></div></li>`).join("")}
        </ul></div>
      </div>
    </div>
    <div class="locfoot"><button class="btn ghost" id="locReset">Reset to Downtown, 15 km</button><button class="btn" id="locDone">Show results</button></div>
  </div></div>`;
  setupMap($("#mapCv"));locLive();
  const ai=$("#addrInput"),sg=$("#sugg");let hi=0,matches=[];
  const drawS=()=>{if(!matches.length){sg.hidden=true;return}sg.hidden=false;sg.innerHTML=matches.map((p,i)=>`<button type="button" data-pi="${i}" class="${i===hi?"hi":""}"><span>${esc(p.name)}</span><small>${fmtKm(km(state.loc,p))} away</small></button>`).join("")};
  const pick=p=>{setPin(p.lat,p.lng,p.name);ai.value=p.name;sg.hidden=true;matches=[];$("#addrMsg").className="addr-msg";$("#addrMsg").textContent=`Pin moved to ${p.name}.`;focusOnLoc()};
  ai.addEventListener("input",()=>{const v=ai.value.trim().toLowerCase();hi=0;
    matches=v?PLACES.filter(p=>p.name.toLowerCase().includes(v)).sort((a,b)=>a.name.toLowerCase().indexOf(v)-b.name.toLowerCase().indexOf(v)).slice(0,6):[];drawS()});
  ai.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"&&matches.length){hi=(hi+1)%matches.length;drawS();e.preventDefault()}
    else if(e.key==="ArrowUp"&&matches.length){hi=(hi-1+matches.length)%matches.length;drawS();e.preventDefault()}
    else if(e.key==="Enter"){e.preventDefault();const m=ai.value.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
      if(m){const lat=+m[1],lng=+m[2];if(lat<B.S||lat>B.N||lng<B.W||lng>B.E){$("#addrMsg").className="addr-msg err";$("#addrMsg").textContent="Those coordinates are outside Metro Vancouver, which is all this prototype covers.";return}
        setPin(lat,lng,null);focusOnLoc();sg.hidden=true;return}
      if(matches.length)pick(matches[hi]);else{$("#addrMsg").className="addr-msg err";$("#addrMsg").textContent="No match in this prototype's place list. Try a neighbourhood such as Kitsilano, or drop a pin on the map."}}
    else if(e.key==="Escape"&&!sg.hidden){sg.hidden=true;e.stopPropagation()}});
  sg.addEventListener("click",e=>{const b=e.target.closest("[data-pi]");if(b)pick(matches[+b.dataset.pi])});
  ai.addEventListener("blur",()=>setTimeout(()=>{sg.hidden=true},150));
  $("#radRange").addEventListener("input",e=>setRadius(+e.target.value,true));
  $("#radRange").addEventListener("change",()=>locChanged());
  $("#radNum").addEventListener("input",e=>{const v=parseInt(e.target.value);if(v>=1&&v<=100)setRadius(v)});
  document.querySelectorAll("[data-rq]").forEach(c=>c.addEventListener("click",()=>{setRadius(+c.dataset.rq);focusOnLoc()}));
  $("#zIn").addEventListener("click",()=>zoomBy(1.5));$("#zOut").addEventListener("click",()=>zoomBy(1/1.5));
  $("#locReset").addEventListener("click",()=>{state.loc={...DEFAULT_LOC};focusOnLoc();locChanged()});
  const close=()=>{$("#locLayer").innerHTML="";map.cv=null;map.ctx=null;render()};
  $("#locDone").addEventListener("click",close);$("#locX").addEventListener("click",close);
  $("#locWrap").addEventListener("click",e=>{if(e.target.id==="locWrap")close()});
  setTimeout(()=>ai.focus({preventScroll:true}),30);
}
window.addEventListener("resize",()=>sizeMap());
const redrawTheme=()=>drawMap();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redrawTheme)}catch(e){}
new MutationObserver(redrawTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---- save popover ---- */
function closeLayer(){$("#layer").innerHTML=""}
function openSave(id,anchor){
  const r=anchor.getBoundingClientRect();
  const draw=(msg="")=>{
    $("#layer").innerHTML=`<div class="scrim" style="background:transparent;z-index:65" data-close></div><div class="pop" role="dialog" aria-label="Save to collection" style="top:${Math.max(16,Math.min(r.bottom+6,innerHeight-330))}px;left:${Math.max(16,Math.min(r.right-280,innerWidth-296))}px">
      <h4>Save to collection</h4>
      <div class="pop-list">${store.cols.map(c=>{const has=c.items.includes(id),full=!has&&c.items.length>=c.limit;
        return `<label class="pop-item ${full?"full":""}"><input type="checkbox" id="pc-${c.id}" data-toggle="${c.id}" ${has?"checked":""} ${full?"disabled":""}>${esc(c.name)}<span class="cap">${full?"full":c.items.length+"/"+c.limit}</span></label>`}).join("")||`<p style="color:var(--muted);margin:4px 0">No collections yet. Create one below.</p>`}</div>
      <form class="newcol" id="popNew"><input id="popNewName" placeholder="New collection" aria-label="New collection name" maxlength="40"><button class="btn" type="submit">Create</button></form>
      ${msg?`<div class="pop-msg">${esc(msg)}</div>`:""}</div>`;
    $("#layer").querySelectorAll("[data-toggle]").forEach(cb=>cb.addEventListener("change",()=>{
      const c=store.cols.find(x=>x.id===cb.dataset.toggle);
      if(cb.checked){if(c.items.length>=c.limit){draw(`“${c.name}” is full. Raise its limit in Collections.`);return}c.items.push(id);toast(`Saved to ${c.name}`)}
      else{c.items=c.items.filter(x=>x!==id);toast(`Removed from ${c.name}`)}
      persist();draw();render()}));
    $("#popNew").addEventListener("submit",e=>{e.preventDefault();const n=$("#popNewName").value.trim();if(!n)return draw("Give the collection a name first.");
      store.cols.push({id:"c"+Date.now(),name:n,limit:20,items:[id]});persist();toast(`Saved to ${n}`);draw();render()});
    $("#layer").querySelector("[data-close]").addEventListener("click",closeLayer);
  };
  draw();
}

function openDrawer(id){
  withDist();
  const l=byId[id],s=SOURCES[l.src],cols=savedIn(id);
  $("#layer").innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="${esc(l.title)}">
    <button class="close" data-close>Close</button>
    <div class="thumb" style="${thumbStyle(l.cat)}"><span class="pricetag">${money(l.price)}</span><span class="cat">${esc(l.cat)}</span></div>
    <h2>${esc(l.title)}</h2>
    <dl class="dl"><dt>Price</dt><dd style="font-family:var(--font-mono);font-weight:700">${money(l.price)}</dd><dt>From</dt><dd><span class="srcbadge"><span class="dot" style="background:var(${s.color})"></span>${s.name}</span></dd><dt>Area</dt><dd>${esc(l.area)}</dd><dt>Distance</dt><dd>${fmtKm(l.km)} from ${esc(state.loc.label)}</dd><dt>Posted</dt><dd>${ago(l.posted)}</dd><dt>Saved in</dt><dd>${cols.length?cols.map(c=>esc(c.name)).join(", "):"Not saved"}</dd></dl>
    <p>${esc(l.desc)}</p>
    <div class="actions"><button class="btn" id="dSave">Save to collection</button><a class="btn ghost" href="${srcUrl(l.src,l.title.split(",")[0])}" target="_blank" rel="noopener">Search on ${s.short}</a></div>
  </aside>`;
  $("#layer").querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeLayer));
  $("#dSave").addEventListener("click",e=>openSave(id,e.currentTarget));
}

/* ---- events ---- */
$("#searchForm").addEventListener("submit",e=>e.preventDefault());
$("#q").addEventListener("input",e=>{state.q=e.target.value;if(state.view!=="browse")state.view="browse";render()});
document.querySelectorAll(".scope button").forEach(b=>b.addEventListener("click",()=>{state.scope=b.dataset.scope;render()}));
$("#pmin").addEventListener("input",e=>{state.min=e.target.value;render()});
$("#pmax").addEventListener("input",e=>{state.max=e.target.value;render()});
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{const[a,z]=b.dataset.p.split(",");state.min=a;state.max=z;$("#pmin").value=a;$("#pmax").value=z;render()}));
$("#srcList").addEventListener("change",e=>{const k=e.target.dataset.src;if(!k)return;e.target.checked?state.srcs.add(k):state.srcs.delete(k);render()});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
$("#reset").addEventListener("click",()=>{Object.assign(state,{q:"",min:"",max:"",scope:"both",sort:"new",srcs:new Set(Object.keys(SOURCES))});$("#q").value=$("#pmin").value=$("#pmax").value="";$("#sort").value="new";renderSources();render()});
$("#navBrowse").addEventListener("click",()=>{state.view="browse";render()});
$("#navCols").addEventListener("click",()=>{state.view="cols";confirmDelete=false;render()});
$("#locChip").addEventListener("click",openLoc);$("#areaBox").addEventListener("click",openLoc);
document.addEventListener("click",e=>{
  const dn=e.target.closest("[data-dens]");if(dn){state.dens=dn.dataset.dens;render();return}
  const sv=e.target.closest("[data-save]");if(sv){e.stopPropagation();openSave(sv.dataset.save,sv);return}
  const op=e.target.closest("[data-open]");if(op){openDrawer(op.dataset.open);return}
  const cl=e.target.closest("[data-col]");if(cl){state.activeCol=cl.dataset.col;confirmDelete=false;render();return}
  const id=e.target.id;const c=store.cols.find(x=>x.id===state.activeCol);
  if(id==="renameBtn"&&c){const n=$("#renameInput").value.trim();if(n){c.name=n;persist();render();toast("Renamed")}}
  if(id==="limitBtn"&&c){const v=Math.max(1,Math.min(500,parseInt($("#limitInput").value)||c.limit));if(v<c.items.length){toast(`Remove ${c.items.length-v} listing(s) first`);return}c.limit=v;persist();render();toast(`Limit set to ${v}`)}
  if(id==="delBtn"){confirmDelete=true;render()}
  if(id==="delNo"){confirmDelete=false;render()}
  if(id==="delYes"&&c){store.cols=store.cols.filter(x=>x!==c);confirmDelete=false;persist();render();toast("Collection deleted")}
});
$("#newColSide").addEventListener("submit",e=>{e.preventDefault();const n=$("#newColSideName").value.trim();if(!n)return;const c={id:"c"+Date.now(),name:n,limit:20,items:[]};store.cols.push(c);state.activeCol=c.id;$("#newColSideName").value="";persist();render();toast("Collection created")});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("#layer").innerHTML)closeLayer();else if($("#locLayer").innerHTML){$("#locLayer").innerHTML="";map.cv=null;map.ctx=null;render()}});

$("#sort").value=state.sort;
renderSources();render();
</script>
